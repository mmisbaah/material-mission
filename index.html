<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material Mission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* OceanHub (Atollingo) theme: light island look with an optional high-contrast mode, as on the hub. */
:root{
  --bg:#f3faf7; --bgtop:#e4f8ff; --surface:#ffffff; --surface2:#e2f5ef; --ink:#123e52; --muted:#46636e; --line:#c4ddd7;
  --sea:#086d75; --sea-ink:#ffffff; --lagoon:#087b83; --coral:#b3422b; --sun:#f2b92f; --palm:#2c8752;
  --header:#ffffffc9; --edge:#ffffff; --shadow:0 4px 0 #184f6414; --focus:#ad421e; --title:#124b68;
  --sky:#e4f8ff; --bench:#f1dcae; --benchline:#c8a36a; --water:#3aa2d6; --shade:#5f7480; --light:#fff1a6; --wet:#245f87;
  --m-wood:#b98451; --m-cloth:#86acd2; --m-plastic:#a6dce8; --m-paper:#fbfaf2; --m-sponge:#f1cf57; --m-metal:#b9c4ca;
  --m-card:#d6ae74; --m-leaf:#72ae5b; --m-basket:#c99a5a; --m-foam:#f6f6f0;
  --s-tiles:#e4ecef; --s-mat:#9a7a5a; --s-sand:#e8cf96; --s-floor:#d9dfe2; --s-grass:#7fb562;
  --c-blue:#3d72c7; --c-brown:#93603a; --c-white:#fbfbf6; --c-yellow:#f1cd47; --c-red:#d55848; --c-green:#4f9a55;
  --ice:#cdeef7; --rust:#c2602a; --clay:#c9805a; --stone:#aaa49b; --tex:rgba(18,62,82,.30); --hi:rgba(255,255,255,.8);
  --ok:#1d7f46; --okbg:#e2f5ef; --bad:#b3422b; --badbg:#fbe8e2; --note:#fff5d9; --noteline:#e1bc69;
  --display:"Baloo 2","Nunito",sans-serif;
  --body:"Nunito","Trebuchet MS",Arial,sans-serif;
  --step:clamp(15px,1.1vw + 11px,18px);
}
:root.high-contrast{
  --bg:#000000; --bgtop:#000000; --surface:#071820; --surface2:#172b36; --ink:#ffffff; --muted:#b8f7ff; --line:#cde5ee;
  --sea:#b8f7ff; --sea-ink:#000000; --lagoon:#b8f7ff; --coral:#ff8a73; --sun:#f5c84e; --palm:#5ebd80;
  --header:#071820; --edge:#cde5ee; --shadow:none; --focus:#ffb38a; --title:#ffffff;
  --sky:#0d2a36; --bench:#5f4d2f; --benchline:#8d7447; --water:#4bb6e8; --shade:#22343c; --light:#5e5527; --wet:#8ccbf0;
  --m-wood:#a8774a; --m-cloth:#6f97be; --m-plastic:#7fbccb; --m-paper:#e9e7da; --m-sponge:#d9b844; --m-metal:#9aa6ad;
  --m-card:#b9925c; --m-leaf:#5e9a4a; --m-basket:#ad824a; --m-foam:#dedcd2;
  --s-tiles:#b9c5ca; --s-mat:#7d6248; --s-sand:#c5ab72; --s-floor:#aab3b8; --s-grass:#5f9548;
  --c-blue:#5a8be0; --c-brown:#a7714a; --c-white:#e8e8e1; --c-yellow:#e1bd3c; --c-red:#e26a5a; --c-green:#62ad68;
  --ice:#9fd0df; --rust:#dc7a40; --clay:#b27050; --stone:#8d887f; --tex:rgba(0,0,0,.38); --hi:rgba(255,255,255,.4);
  --ok:#6fd69a; --okbg:#10382a; --bad:#ff9a82; --badbg:#3c1f19; --note:#162d39; --noteline:#cde5ee;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:var(--step)}
body{background:var(--bg) linear-gradient(var(--bgtop),#edfaf5 55%,#fff3d8) fixed;color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;margin:0;min-height:100%}
:root.high-contrast body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bgtop)}
.big-text{font-size:1.12rem}
h1,h2,h3{font-family:var(--display);font-weight:700;color:var(--title);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.15rem}
h1:focus,h2:focus{outline:none}
a{color:var(--sea)}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header);color:var(--ink);border-radius:0 0 24px 24px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;background:none;border:0;cursor:pointer;padding:4px;color:inherit;text-align:left}
.brand b{font-family:var(--display);font-weight:800;font-size:1.35rem;display:block;line-height:1;color:var(--ink)}
.brand small{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:var(--sea)}
.topbtn{background:transparent;border:0;color:var(--sea);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.95rem;cursor:pointer;min-height:44px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:5px}
.topbtn:hover{text-decoration-color:currentColor}
.topbtn[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.wave{display:none;height:14px;background:radial-gradient(circle at 10px -4px,transparent 12px,var(--bg) 13px) 0 0/20px 14px repeat-x;background-color:var(--sea)}

main{padding-block:18px 64px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:var(--sea)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;border:1px solid var(--sea);background:var(--sea);color:var(--sea-ink);font-family:var(--body);font-weight:800;font-size:1.02rem;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);border-radius:12px}
.btn.ghost:hover{border-color:var(--sea);background:var(--surface2)}
.btn.warn{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.92rem;border-radius:12px}
.linkbtn{background:none;border:0;color:var(--sea);text-decoration:underline;cursor:pointer;padding:6px 2px;font-weight:700}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.hero svg{width:100%;height:auto;border-radius:22px;display:block}
.hero h1{font-size:2.5rem;margin-bottom:8px}
.hero .lede{font-size:1.1rem;max-width:34ch}
.gradebadge{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:2px solid var(--edge);box-shadow:var(--shadow);border-radius:22px;padding:16px;min-width:0}
.mcard .num{font-family:var(--display);font-weight:700;color:var(--sea);font-size:.95rem}
.mcard svg.scene{border-radius:14px}
.mcard .goal{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px 3px 6px;border:2px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--sea);color:var(--ink);background:var(--surface2)}
.chip svg{width:14px;height:14px}
.stamp{width:54px;height:54px;flex:none}
/* one-screen home */
html.onescreen,html.onescreen body{height:100%;overflow:hidden}
html.onescreen #app{height:100%;display:flex;flex-direction:column}
html.onescreen main{flex:1 1 auto;min-height:0;display:flex;padding-block:clamp(10px,3vh,32px)}
.home{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,3vw,44px);align-items:center}
.home-main{display:flex;flex-direction:column;gap:clamp(8px,1.8vh,16px);min-height:0}
.home h1{font-size:clamp(1.9rem,5.2vh,3rem);font-weight:800;letter-spacing:-.02em}
.home h1 em{font-style:normal;color:var(--lagoon)}
.home .lede{max-width:38ch}
.home-art{min-height:0;height:100%;display:flex;align-items:center;justify-content:center}
.home-art svg{width:100%;height:100%;max-height:440px;display:block;filter:drop-shadow(0 7px 0 #92d5dc44)}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vh,12px)}
.gtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:clamp(6px,1.2vh,12px) 12px;border-radius:18px;border:2px solid var(--edge);box-shadow:var(--shadow);background:var(--surface);cursor:pointer;text-align:left;min-height:56px}
.gtile:hover{border-color:var(--sea);background:var(--surface2)}
.gtile.cur{border-color:var(--sea);box-shadow:inset 0 0 0 2px var(--sea)}
.gtile .gl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gtile .gn{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4.2vh,2.2rem);line-height:1;color:var(--sea)}
.gtile .gs{font-size:.75rem;font-weight:700;color:var(--muted)}
.gtile .bar{align-self:stretch;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.gtile .bar span{display:block;height:100%;background:var(--palm)}
.missions10{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.missions10 .mcard{padding:14px;gap:8px}
.missions10 .stamp{width:44px;height:44px}
.gsw{min-width:44px;min-height:44px;justify-content:center;font-family:var(--display)}
.gsw[aria-pressed="true"]::before{display:none}
@media (max-width:820px){
  .home{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:stretch}
  .home-art svg{max-height:none}
}
@media (max-height:620px){ .home .lede,.home .eyebrow{display:none} }
@media (max-width:480px){
  .brand span{display:none}
  .topbtn{padding:5px 11px;font-size:.8rem}
  .home .lede{font-size:.92rem}
  .gtile .gs{font-size:.68rem}
}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* step track */
.mhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.mhead .title{flex:1;min-width:0}
.track{list-style:none;display:flex;gap:6px;padding:0;margin:14px 0 0;flex-wrap:wrap}
.track li{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;padding:4px 10px 4px 5px;border-radius:12px;background:var(--surface2);border:1px solid transparent;color:var(--muted)}
.track li .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;border:2px solid currentColor}
.track li.done{color:var(--sea)}
.track li.cur{color:var(--sea-ink);background:var(--sea);border-color:var(--sea)}

.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.scenebox{background:var(--surface);border:2px solid var(--edge);box-shadow:var(--shadow);border-radius:22px;padding:10px;position:relative}
svg.scene{width:100%;height:auto;display:block;border-radius:16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:8px;border:2px dashed var(--muted);color:var(--muted)}
.cond{font-size:.86rem;color:var(--muted)}
.cond ul{margin:4px 0 0;padding-left:1.1em}

fieldset.ctl{border:0;padding:0;margin:0}
fieldset.ctl legend{font-weight:700;margin-bottom:6px;padding:0}
fieldset.cer{border:2px solid var(--line);border-radius:16px;padding:10px 12px 12px}
fieldset.cer legend{padding:0 6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:52px;min-width:52px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea);color:var(--sea-ink)}
.opt[aria-pressed="true"]::before{content:"✓";font-weight:900;flex:none}
.tag{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--note);border:1px solid var(--noteline);color:var(--ink);margin-left:6px;white-space:nowrap}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.choice{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px;border-radius:18px;border:3px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-weight:700;font-size:1.02rem;min-height:64px}
.choice[aria-pressed="true"]{border-color:var(--sea);background:var(--surface2);box-shadow:0 0 0 2px var(--sea) inset}
.choice .lab{display:flex;gap:8px;align-items:center}
.choice[aria-pressed="true"] .lab::before{content:"✓";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sea);color:var(--sea-ink);font-size:.8rem;flex:none}
.answers{display:flex;flex-direction:column;gap:10px}
.answer{padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-weight:700;min-height:56px;display:flex;gap:10px;align-items:center}
.answer .mk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.85rem}
.answer.right{border-color:var(--ok);background:var(--okbg)}
.answer.right .mk{border-color:var(--ok);background:var(--ok);color:var(--surface);border-radius:50%}
.answer.wrong{border-color:var(--bad);background:var(--badbg)}
.answer.wrong .mk{border-color:var(--bad);color:var(--bad)}

.fb{border-radius:16px;padding:12px 14px;border:2px solid;display:flex;gap:10px;align-items:flex-start}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb.note{border-color:var(--noteline);background:var(--note)}
.fb .ic{flex:none;font-weight:700;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;border:2px solid currentColor}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:12px}
.hint svg{width:58px;height:58px;flex:none}
.hint .lvl{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.reqs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.reqs li{display:flex;gap:8px;align-items:flex-start}
.reqs .mk{flex:none;width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:.8rem;border-radius:6px;border:2px solid var(--muted);color:var(--muted)}
.reqs li.y .mk{border-color:var(--ok);background:var(--ok);color:var(--surface);border-radius:50%}
.reqs li.n .mk{border-color:var(--bad);color:var(--bad)}

.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:700}
tr.pair td{background:var(--okbg)}
tr:last-child td{border-bottom:0}

.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.evcard{background:var(--surface);border:2px solid var(--edge);box-shadow:var(--shadow);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.evcard .res{font-family:var(--display);font-size:1.3rem;font-weight:600}
.predcard{background:var(--note);border:2px solid var(--noteline);border-radius:18px;padding:12px 14px}
.diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diff > div{border-radius:16px;padding:12px;border:2px solid var(--line);background:var(--surface)}
.diff .changed{border-color:var(--coral)}
.infocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.info{background:var(--surface);border:2px solid var(--edge);box-shadow:var(--shadow);border-radius:16px;padding:12px;min-width:0}
.info h3{font-size:1rem;margin-bottom:4px}
.info ul{margin:0;padding-left:1.1em;font-size:.9rem}

.sortbox{display:flex;flex-direction:column;gap:14px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item{border:3px solid var(--line);border-radius:18px;background:var(--surface);padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;min-height:120px}
.item svg{width:84px;height:84px}
.item[aria-pressed="true"]{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea) inset}
.item.placed{opacity:.4}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bin{border:3px dashed var(--muted);border-radius:18px;background:var(--surface2);padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;font-weight:700}
.bin .sw{width:64px;height:40px;border-radius:8px}
.bin .in{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.bin .in svg{width:42px;height:42px}

.navbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:16px}
.navbar .why{font-size:.88rem;color:var(--muted);flex:1;min-width:180px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw-btn{width:64px;height:36px;border-radius:999px;border:2px solid var(--muted);background:var(--surface2);position:relative;cursor:pointer;flex:none}
.sw-btn::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:left .2s}
.sw-btn[aria-checked="true"]{background:var(--sea);border-color:var(--sea)}
.sw-btn[aria-checked="true"]::after{left:30px;background:var(--sea-ink)}
.gradepick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.gradepick .opt{justify-content:center;font-family:var(--display);font-size:1.2rem}
.gradepick .opt[aria-pressed="true"]::before{display:none}
textarea.export{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,monospace;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px}
.confirm{border:3px solid var(--coral);border-radius:18px;padding:14px;background:var(--badbg)}
.check{display:flex;gap:6px;align-items:center;font-size:.82rem;white-space:nowrap}
.check input{width:20px;height:20px;accent-color:var(--sea)}
.summary-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.summary-top svg.stamp{width:110px;height:110px}
.indic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.indic > div{border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--surface)}
.indic .on{border-color:var(--ok)}
.indic b{display:block;font-family:var(--display);font-weight:600}
.warnbar{background:var(--note);border-bottom:2px solid var(--noteline);font-size:.88rem}
.warnbar .wrap{padding-block:8px}

/* svg classes */
.f-sky{fill:var(--sky)} .f-bench{fill:var(--bench)} .f-sea{fill:var(--sea)} .f-lagoon{fill:var(--lagoon)} .f-sand{fill:var(--s-sand)}
.f-coral{fill:var(--coral)} .f-sun{fill:var(--sun)} .f-palm{fill:var(--palm)} .f-ink{fill:var(--ink)} .f-surface{fill:var(--surface)}

/* ---- house plan, seen from above ---- */
:root{--wall:#2a5466;--fl-wood:#efdcbc;--fl-wood2:#e3cba3;--fl-tile:#f4f7f6;--fl-tile2:#dce9e6;--fl-carpet:#e4eef8;--fl-carpet2:#d6e3f1;--fl-concrete:#e6e8e6;--fl-grass:#cfe8b6;--fl-grass2:#bddba1;--fl-deck:#ead2a4;--fl-deck2:#dcbf88;--fl-court:#bfe3dc}
:root.high-contrast{--wall:#cde5ee;--fl-wood:#2a2418;--fl-wood2:#231e14;--fl-tile:#13222a;--fl-tile2:#0d1a20;--fl-carpet:#142233;--fl-carpet2:#101c2a;--fl-concrete:#1a1f22;--fl-grass:#13261a;--fl-grass2:#0f1f15;--fl-deck:#2a2214;--fl-deck2:#221b10;--fl-court:#10302c}
.plot{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,3fr);grid-template-rows:auto auto;grid-template-areas:"garden house" "veranda house";gap:12px}
.plot::before{content:"Island School";grid-area:house;align-self:start;justify-self:center;margin-top:-13px;z-index:3;background:var(--wall);color:#fff;font:800 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;padding:2px 12px;border-radius:999px;height:fit-content}
.plot>.room-garden{grid-area:garden;border-radius:22px}
.plot>.room-playground{grid-area:veranda;border-radius:22px}
.house{grid-area:house;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"classroom library art" "lab lab canteen" "dt dt canteen";gap:6px;padding:6px;background:var(--wall);border-radius:14px;box-shadow:0 6px 0 #184f6422}
.room{position:relative;min-height:128px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;min-width:0}
.house .room{border-radius:4px}
.room-classroom{grid-area:classroom}.room-library{grid-area:library}.room-art{grid-area:art}.room-lab{grid-area:lab}.room-canteen{grid-area:canteen}.room-dt{grid-area:dt}
.room-classroom{background:repeating-linear-gradient(90deg,var(--fl-wood) 0 26px,var(--fl-wood2) 26px 28px)}
.room-library{background:radial-gradient(var(--fl-carpet2) 1.2px,transparent 1.6px) 0 0/9px 9px,var(--fl-carpet)}
.room-art{background:radial-gradient(circle at 20% 30%,#f2b92f22 0 6px,transparent 7px) 0 0/46px 40px,radial-gradient(circle at 70% 70%,#3d72c722 0 5px,transparent 6px) 0 0/38px 44px,var(--fl-concrete)}
.room-lab,.room-canteen{background:conic-gradient(var(--fl-tile2) 25%,var(--fl-tile) 0 50%,var(--fl-tile2) 0 75%,var(--fl-tile) 0) 0 0/28px 28px}
.room-canteen{background:conic-gradient(var(--fl-deck) 25%,var(--fl-wood) 0 50%,var(--fl-deck) 0 75%,var(--fl-wood) 0) 0 0/32px 32px}
.room-dt{background:var(--fl-concrete)}
.room-garden{background:radial-gradient(var(--fl-grass2) 1.5px,transparent 2px) 0 0/11px 11px,var(--fl-grass);border:2px dashed var(--palm)}
.room-playground{background:linear-gradient(90deg,transparent 49.5%,#ffffff88 49.5% 50.5%,transparent 50.5%),var(--fl-court);border:2px dashed var(--lagoon)}
.room .furn{position:absolute;right:8px;bottom:6px;width:clamp(64px,30%,110px);height:auto;opacity:.5;pointer-events:none}
.room.empty .furn{opacity:.75}
.rname{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-family:var(--body);font-weight:900;color:var(--ink);background:var(--surface);align-self:flex-start;padding:2px 9px;border-radius:999px;box-shadow:var(--shadow);position:relative}
.room.empty .rname{color:var(--muted)}
.mtoks{display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;max-width:100%}
.mtok{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 6px;border-radius:14px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font-weight:800;font-size:.9rem;box-shadow:0 3px 0 #184f6426;text-align:left;cursor:pointer;max-width:100%}
.mtok:hover{border-color:var(--sea);transform:translateY(-1px)}

.mtok .mtitle{min-width:0;overflow-wrap:break-word;hyphens:manual;line-height:1.2}
.mtok .mst{flex:none;color:var(--coral);font-size:1rem;display:inline-flex}
.mtok .mst svg{width:15px;height:15px;color:var(--sea)}
.mtok.going{border-color:var(--sea)}
.mtok.done{border-color:var(--coral)}
.mtok.done .mnum{background:var(--coral);color:#fff}
.mtok-key{display:inline-block;width:14px;height:14px;border-radius:5px;border:2px solid var(--line);background:var(--surface);vertical-align:-2px}
.mtok-key.going{border-color:var(--sea)} .mtok-key.done{border-color:var(--coral);background:var(--coral)}

/* ---- street map: rooms both sides of a vertical road ---- */
:root{--road:#6c7f88;--roadline:#ffffffcc}
:root.high-contrast{--road:#25343b;--roadline:#cde5ee}
.street{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);grid-template-rows:repeat(var(--rows),minmax(92px,auto));column-gap:12px;row-gap:8px;padding-block:18px}
.street .room{padding:8px 10px}
.road{position:relative;background:linear-gradient(90deg,#00000014 0 4px,transparent 4px calc(100% - 4px),#00000014 calc(100% - 4px)),var(--road);border-radius:16px;margin-block:-18px;box-shadow:inset 0 0 0 3px #ffffff33}
.road::before{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;background:repeating-linear-gradient(var(--roadline) 0 16px,transparent 16px 30px)}

.road .gate{top:-10px}.road .finish{bottom:-10px;color:var(--coral)}
.player{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:4;transition:top 1.1s ease-in-out,left .5s ease-in-out;filter:drop-shadow(0 4px 0 #00000033)}

.player.walking svg{animation:walk .28s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4px) rotate(6deg)}}
.street .room{min-height:0;border-radius:16px;overflow:visible}
.street .room::before,.street .room::after{display:none}
.street .room.lot-left::after,.street .room.lot-right::after{display:block;content:"";position:absolute;top:50%;width:14px;height:34px;margin-top:-17px;background:var(--surface2);border-block:2px solid var(--edge);z-index:1}
